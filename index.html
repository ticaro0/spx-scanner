<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SPX Scanner</title>


  <style>

    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }


    body{

      margin:0;

      padding:15px;

      background:#f5f5f5;

    }


    .card{

      max-width:600px;

      margin:auto;

      background:#fff;

      padding:18px;

      border-radius:15px;

      box-shadow:0 3px 10px rgba(0,0,0,.15);

    }


    h2{

      text-align:center;

      color:#ee4d2d;

      margin-top:0;

    }


    input{

      width:100%;

      height:55px;

      font-size:20px;

      padding:10px;

      border:2px solid #ddd;

      border-radius:10px;

    }


    button{

      width:100%;

      height:55px;

      margin-top:12px;

      border:0;

      border-radius:10px;

      background:#ee4d2d;

      color:#fff;

      font-size:20px;

    }


    #cameraBox{

      display:none;

      margin-top:15px;

      background:#000;

      border-radius:10px;

      overflow:hidden;

      position:relative;

    }


    video{

      width:100%;

      display:block;

    }


    #scanLine{

      position:absolute;

      top:50%;

      left:10%;

      width:80%;

      height:3px;

      background:#ee4d2d;

    }


    .item{

      display:flex;

      padding:12px;

      margin-top:7px;

      background:#fff;

      border-left:5px solid #ee4d2d;

      border-radius:8px;

    }


    .title{

      width:43%;

      color:#777;

      font-size:14px;

    }


    .value{

      width:57%;

      font-weight:bold;

      word-break:break-word;

    }


    .error{

      margin-top:15px;

      padding:15px;

      color:#c62828;

      background:#ffebee;

      border-radius:10px;

    }


    #loading{

      display:none;

      text-align:center;

      margin:15px;

      font-size:18px;

    }

  </style>

</head>


<body>


<div class="card">


  <h2>📦 SPX TRACKING CHECK</h2>


  <input

    id="tracking"

    placeholder="Quét hoặc nhập mã vận đơn"

    autocomplete="off"

    autofocus

  >


  <button onclick="startCamera()">

    📷 Quét bằng camera

  </button>


  <div id="cameraBox">

    <video

      id="video"

      autoplay

      playsinline

    ></video>


    <div id="scanLine"></div>

  </div>


  <button

    id="closeButton"

    onclick="stopCamera()"

    style="display:none;background:#555"

  >

    ❌ Đóng camera

  </button>


  <button onclick="search()">

    🔍 Tra cứu

  </button>


  <div id="loading">

    ⏳ Đang tra cứu...

  </div>


  <div id="result"></div>


</div>


<script>


/****************************************************
 * CONFIG
 ****************************************************/


const API_URL =

  "https://script.google.com/a/macros/spxexpress.com/s/AKfycby9ISjVWvbmycc55h-PmhoTov796QvJ8H47CuuYk-DKPFKApnLlU6ueSQ7HXNdUp0DUWQ/exec";


const PUBLIC_KEY =

  "SPX_PUBLIC_2026";


let stream = null;

let scanTimer = null;


/****************************************************
 * ELEMENTS
 ****************************************************/


const input =

  document.getElementById(
    "tracking"
  );


const video =

  document.getElementById(
    "video"
  );


const cameraBox =

  document.getElementById(
    "cameraBox"
  );


const closeButton =

  document.getElementById(
    "closeButton"
  );


const loading =

  document.getElementById(
    "loading"
  );


const result =

  document.getElementById(
    "result"
  );


/****************************************************
 * CAMERA
 ****************************************************/


async function startCamera(){


  if (

    !navigator.mediaDevices ||

    !navigator.mediaDevices.getUserMedia

  ){

    showError(
      "Trình duyệt không hỗ trợ camera."
    );

    return;

  }


  try{


    stream =

      await navigator.mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:"environment"
            }

          },

          audio:false

        });


    video.srcObject =
      stream;


    cameraBox.style.display =
      "block";


    closeButton.style.display =
      "block";


    const detector =

      new BarcodeDetector({

        formats:[

          "qr_code",

          "code_128",

          "code_39",

          "ean_13",

          "ean_8"

        ]

      });


    scanTimer =

      setInterval(

        async function(){


          try{


            const codes =

              await detector.detect(
                video
              );


            if (

              codes.length > 0

            ){

              const code =

                codes[0].rawValue;


              input.value =
                code;


              stopCamera();


              search();


            }


          }catch(e){

            console.log(e);

          }


        },

        150

      );


  }catch(e){

    showError(

      "Không thể mở camera: " +

      e.message

    );

  }

}


/****************************************************
 * STOP CAMERA
 ****************************************************/


function stopCamera(){


  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer =
      null;

  }


  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream =
      null;

  }


  video.srcObject =
    null;


  cameraBox.style.display =
    "none";


  closeButton.style.display =
    "none";

}


/****************************************************
 * SEARCH - JSONP
 ****************************************************/


function search(){


  const shipment =

    input.value.trim();


  if(!shipment){

    return;

  }


  loading.style.display =
    "block";


  result.innerHTML =
    "";


  const callbackName =

    "spxCallback_" +

    Date.now();


  window[callbackName] =

    function(res){


      loading.style.display =
        "none";


      delete window[
        callbackName
      ];


      if(

        !res.success

      ){

        showError(
          res.message
        );

        return;

      }


      showResult(
        res
      );

    };


  const script =

    document.createElement(
      "script"
    );


  script.src =

    API_URL +

    "?api=1" +

    "&key=" +

    encodeURIComponent(
      PUBLIC_KEY
    ) +

    "&shipment=" +

    encodeURIComponent(
      shipment
    ) +

    "&callback=" +

    callbackName;


  script.onerror =

    function(){

      loading.style.display =
        "none";


      showError(
        "Không thể kết nối Apps Script."
      );

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * SHOW RESULT
 ****************************************************/


function showResult(res){


  result.innerHTML =

    row(
      "📦 Mã vận đơn",
      res.shipment
    )


    +

    row(
      "📍 Trạm hiện tại",
      res.currentStation
    )


    +

    row(
      "➡️ Trạm tiếp theo",
      res.nextStation
    )


    +

    row(
      "🏷️ Sort Code",
      res.sortCode
    )


    +

    row(
      "📅 Ngày giờ nhận tại trạm",
      res.currentStationReceivedTime
    )


    +

    row(
      "📋 Trạng thái đơn",
      res.orderStatus
    );


  input.value =
    "";


  input.focus();

}


/****************************************************
 * ROW
 ****************************************************/


function row(
  title,
  value
){

  return `

    <div class="item">

      <div class="title">

        ${title}

      </div>


      <div class="value">

        ${value || "-"}

      </div>

    </div>

  `;

}


/****************************************************
 * ERROR
 ****************************************************/


function showError(
  message
){

  result.innerHTML =

    `<div class="error">

      ❌ ${message}

    </div>`;

}


input.addEventListener(

  "keydown",

  function(e){

    if(

      e.key === "Enter"

    ){

      search();

    }

  }

);


</script>


</body>

</html>
