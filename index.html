<!DOCTYPE html>
<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SPX Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      padding:15px;
      background:#f5f5f5;
    }

    .card{
      max-width:600px;
      margin:auto;
      background:#fff;
      padding:18px;
      border-radius:15px;
      box-shadow:0 3px 10px rgba(0,0,0,.15);
    }

    h2{
      text-align:center;
      color:#ee4d2d;
      margin-top:0;
    }

    #reader{
      width:100%;
      margin-top:15px;
    }

    input{
      width:100%;
      height:55px;
      font-size:20px;
      padding:10px;
      border:2px solid #ddd;
      border-radius:10px;
      margin-top:15px;
    }

    button{
      width:100%;
      height:55px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      background:#ee4d2d;
      color:#fff;
      font-size:20px;
    }

    #loading{
      display:none;
      text-align:center;
      font-size:20px;
      margin-top:15px;
    }

    #result{
      margin-top:15px;
    }

    .item{
      display:flex;
      padding:12px;
      margin-bottom:6px;
      border-left:5px solid #ee4d2d;
      background:#fff;
      border-radius:8px;
    }

    .title{
      width:42%;
      color:#777;
      font-size:14px;
    }

    .value{
      width:58%;
      font-size:17px;
      font-weight:bold;
      word-break:break-word;
    }

    .error{
      padding:15px;
      background:#ffebee;
      color:#c62828;
      border-radius:10px;
      text-align:center;
      font-size:18px;
    }

  </style>

</head>


<body>


<div class="card">


  <h2>📦 SPX TRACKING CHECK</h2>


  <div id="reader"></div>


  <input
    id="tracking"
    placeholder="Hoặc nhập Shipment ID..."
    autocomplete="off"
  >


  <button onclick="search()">
    🔍 Tra cứu
  </button>


  <div id="loading">
    ⏳ Đang tra cứu...
  </div>


  <div id="result"></div>


</div>


<script>


const API_URL =

"https://script.google.com/a/macros/spxexpress.com/s/AKfycby9ISjVWvbmycc55h-PmhoTov796QvJ8H47CuuYk-DKPFKApnLlU6ueSQ7HXNdUp0DUWQ/exec";


const PUBLIC_KEY =
"SPX_PUBLIC_2026";


const input =
document.getElementById("tracking");


const loading =
document.getElementById("loading");


const result =
document.getElementById("result");


/****************************************************
 * KHỞI TẠO CAMERA
 ****************************************************/

const scanner =
new Html5QrcodeScanner(

  "reader",

  {

    fps:10,

    qrbox:{
      width:280,
      height:160
    },

    rememberLastUsedCamera:true

  },

  false

);


scanner.render(

  function(decodedText){

    input.value =
    decodedText;


    scanner.clear()
      .then(function(){

        search();

      });


  },

  function(error){

    // Không hiển thị lỗi quét liên tục

  }

);


/****************************************************
 * ENTER
 ****************************************************/

input.addEventListener(

  "keydown",

  function(e){

    if(e.key === "Enter"){

      search();

    }

  }

);


/****************************************************
 * TRA CỨU TRỰC TIẾP
 ****************************************************/

async function search(){


  const shipment =
  input.value.trim();


  if(!shipment){

    return;

  }


  loading.style.display =
  "block";


  result.innerHTML =
  "";


  try{


    const response =
    await fetch(

      API_URL,

      {

        method:"POST",

        headers:{

          "Content-Type":
          "text/plain;charset=utf-8"

        },

        body:

        JSON.stringify({

          key:
          PUBLIC_KEY,

          shipment:
          shipment

        })

      }

    );


    const data =
    await response.json();


    showResult(data);


  }catch(error){


    result.innerHTML =

    '<div class="error">' +

    '❌ Không thể kết nối API<br><br>' +

    error.message +

    '</div>';


  }


  loading.style.display =
  "none";

}


/****************************************************
 * TẠO DÒNG KẾT QUẢ
 ****************************************************/

function row(title,value){

  return `

    <div class="item">

      <div class="title">
        ${title}
      </div>

      <div class="value">
        ${value || "-"}
      </div>

    </div>

  `;

}


/****************************************************
 * HIỂN THỊ KẾT QUẢ
 ****************************************************/

function showResult(res){


  if(!res.success){

    result.innerHTML =

    '<div class="error">' +

    '❌ ' +

    res.message +

    '</div>';

    return;

  }


  result.innerHTML =

    row(
      "📦 Mã vận đơn",
      res.shipment
    )

    +

    row(
      "📍 Trạm hiện tại",
      res.currentStation
    )

    +

    row(
      "➡️ Trạm tiếp theo",
      res.nextStation
    )

    +

    row(
      "🏷️ Sort Code",
      res.sortCode
    )

    +

    row(
      "📅 Ngày nhận tại trạm",
      res.currentStationReceivedTime
    )

    +

    row(
      "📋 Trạng thái đơn",
      res.orderStatus
    );


  input.value =
  "";

}

</script>


</body>

</html>
